{{- $here := .RelPermalink -}}
{{- $c := hugo.Data.chapter -}}
<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="{{ "" | relURL }}">
      <img class="brand__logo" src="{{ "images/brand/seal-square.png" | relURL }}" width="40" height="40" alt="">
      <span class="brand__text"><strong>{{ $c.name }}</strong><small>{{ $c.chapter }}</small></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <ul>
        {{- range hugo.Data.nav }}
        <li><a href="{{ .href | relURL }}"{{ if partial "nav-current.html" (dict "href" .href "here" $here) }} aria-current="page"{{ end }}>{{ .label }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
