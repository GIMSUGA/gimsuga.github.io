<div class="wrap page">
  <h1>{{ .Title }}</h1>
  <p class="lede">The chapter executive.</p>
  <ul class="people">
    {{- range hugo.Data.officers }}
    <li class="person card">
      <span class="avatar" aria-hidden="true">{{ substr .name 0 1 }}</span>
      <div>
        <p class="person__role">{{ .role }}</p>
        <p class="card__title">{{ .name }}</p>
      </div>
    </li>
    {{- end }}
  </ul>
  <p class="muted">To reach the executive, use the chapter's contacts on the <a href="{{ "join/" | relURL }}">Join</a> page.</p>
</div>
